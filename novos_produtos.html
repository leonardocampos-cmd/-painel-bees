<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Novos produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;800;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ?v= evita que o navegador mostre dados antigos do cache -->
<script>document.write('<link rel="stylesheet" href="estilo.css?v=' + Date.now() + '">')</script>
<script>document.write('<script src="dados.js?v=' + Date.now() + '"><\/script>')</script>
<script>document.write('<script src="comum.js?v=' + Date.now() + '"><\/script>')</script>
<style>
  .filtros-np { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 10px; margin-top: 26px; }
  @media (max-width: 900px) { .filtros-np { grid-template-columns: 1fr 1fr; } }
  .filtros-np input, .filtros-np select {
    width: 100%; padding: 10px 14px; border: 1px solid var(--linha); border-radius: 999px;
    background: var(--superficie); color: var(--tinta); font: inherit; font-size: 14px;
  }
  .acoes-np { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; }
  .grade-np { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
  .np { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden;
    display: flex; flex-direction: column; }
  .np.errada { border-color: var(--alerta); box-shadow: 0 0 0 2px var(--alerta) inset; }
  .np .foto { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--linha); }
  .np .foto img { max-width: 88%; max-height: 92%; object-fit: contain; }
  .np .foto span { color: #999; font-size: 13px; padding: 0 12px; text-align: center; }
  .np .corpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; font-size: 13px; }
  .np h3 { font-family: var(--titulo); font-size: 15px; font-weight: 600; line-height: 1.25; }
  .np .meta { color: var(--apagado); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .np .rodape { margin-top: auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-top: 6px; }
  .np .rodape a { color: var(--apagado); font-size: 12px; }
  .bt-errada { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linha); background: transparent;
    color: var(--tinta); font: inherit; font-size: 12px; cursor: pointer; }
  .np.errada .bt-errada { background: var(--alerta); border-color: var(--alerta); color: #fff; }
  .curva { font-weight: 700; }
  .mais { margin: 22px auto 0; display: block; }
</style>
</head>
<body>
<main>
  <h1>Novos produtos para o BEES</h1>
  <p class="sub" id="sub">Produtos que vão na planilha de cadastro do BEES (Rigarr e Castas), com a foto escolhida. Confira as fotos e marque as erradas.</p>

  <div class="filtros-np">
    <input id="f-busca" type="search" placeholder="Buscar por nome, SKU ou marca">
    <select id="f-vend"><option value="">Rigarr e Castas</option><option value="RIGARR">Rigarr</option><option value="CASTAS">Castas</option></select>
    <select id="f-foto"><option value="">Com e sem foto</option><option value="com">Com foto</option><option value="sem">Sem foto</option><option value="errada">Marcadas como erradas</option></select>
    <select id="f-fonte"><option value="">Todas as fontes</option></select>
    <select id="f-curva"><option value="">Todas as curvas</option><option value="A">Curva A</option><option value="B">Curva B</option><option value="C">Curva C</option><option value="-">Sem curva</option></select>
  </div>
  <div class="acoes-np">
    <button class="botao" id="b-erradas">Baixar fotos erradas</button>
    <span class="fraco" id="dica">Salve o arquivo baixado em <b>G:\Drives compartilhados\BEES\Produtos\</b> — na próxima geração essas fotos saem e o robô procura outra.</span>
  </div>

  <div class="grade g-kpi" id="kpis"></div>
  <div class="grade-np" id="grade"></div>
  <button class="botao mais" id="b-mais" hidden>Mostrar mais</button>
</main>

<script>
montarTopo("novos");

const NP = D.novos_produtos || {};
const itens = ["RIGARR", "CASTAS"].flatMap((v) => ((NP[v] || {}).itens || []).map((p) => ({ ...p, vendedor: v })));
const gerado = ["RIGARR", "CASTAS"].map((v) => (NP[v] || {}).gerado_em).filter(Boolean).sort().pop();
if (gerado) $("#sub").textContent += ` Planilhas de ${new Date(gerado).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}.`;
$("#f-fonte").insertAdjacentHTML("beforeend", [...new Set(itens.map((p) => p.fonte).filter(Boolean))].sort()
  .map((f) => `<option>${esc(f)}</option>`).join(""));

// Marcação "foto errada" fica no navegador (por SKU + URL da foto) até baixar o arquivo
const CHAVE = "fotos_erradas";
let erradas = {};
try { erradas = JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch {}
const id = (p) => `${p.vendedor}|${p.sku}|${p.imagem}`;
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(erradas)); } catch {} };

const POR_PAGINA = 60;
let limite = POR_PAGINA;

function filtrar() {
  const b = $("#f-busca").value.trim().toUpperCase();
  const v = $("#f-vend").value, foto = $("#f-foto").value, fonte = $("#f-fonte").value, curva = $("#f-curva").value;
  return itens.filter((p) =>
    (!v || p.vendedor === v) && (!fonte || p.fonte === fonte) &&
    (!curva || (curva === "-" ? !p.curva : p.curva === curva)) &&
    (!foto || (foto === "com" ? !!p.imagem : foto === "sem" ? !p.imagem : !!erradas[id(p)])) &&
    (!b || [p.nome, p.sku, p.marca].join(" ").toUpperCase().includes(b)));
}

function card(p) {
  const marcada = !!erradas[id(p)];
  return `<article class="np${marcada ? " errada" : ""}" data-id="${esc(id(p))}">
    <div class="foto">${p.imagem ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy" referrerpolicy="no-referrer"
      onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent: 'Foto não abriu'}))">` : "<span>Sem foto</span>"}</div>
    <div class="corpo">
      <h3>${esc(p.nome)}</h3>
      <div class="meta"><span>SKU ${esc(p.sku)}</span><span class="tag ${p.vendedor === "CASTAS" ? "castas" : "rigarr"}">${p.vendedor === "CASTAS" ? "Castas" : "Rigarr"}</span>
        ${p.curva ? `<span>Curva <span class="curva">${esc(p.curva)}</span></span>` : ""}</div>
      <div class="meta"><span>Saída ${esc(p.ultima_saida)}</span><span>Estoque ${int(p.estoque)}</span><span>${esc(p.estados)}</span></div>
      ${p.ja_rigarr ? '<div class="meta"><span class="tag hoje">Já está no BEES pela Rigarr</span></div>' : ""}
      <div class="rodape">
        <span>${p.fonte ? esc(p.fonte) : ""}${p.pagina ? ` · <a href="${esc(p.pagina)}" target="_blank" rel="noopener noreferrer">ver página</a>` : ""}</span>
        ${p.imagem ? `<button class="bt-errada" data-id="${esc(id(p))}">${marcada ? "Marcada" : "Foto errada"}</button>` : ""}
      </div>
    </div></article>`;
}

function render() {
  const lista = filtrar();
  const comFoto = lista.filter((p) => p.imagem).length;
  $("#kpis").innerHTML = [
    kpi("Produtos", int(lista.length), "no filtro escolhido", true),
    kpi("Com foto", int(comFoto), lista.length ? `${Math.round(comFoto / lista.length * 100)}% do filtro` : ""),
    kpi("Sem foto", int(lista.length - comFoto), "ainda sendo buscadas"),
    kpi("Marcadas como erradas", int(Object.keys(erradas).length), "para baixar e salvar"),
  ].join("");
  $("#grade").innerHTML = lista.length ? lista.slice(0, limite).map(card).join("")
    : `<p class="vazio">Nenhum produto com esses filtros.</p>`;
  $("#b-mais").hidden = lista.length <= limite;
  $("#b-mais").textContent = `Mostrar mais (${int(lista.length - limite)} restantes)`;
}

$("#grade").addEventListener("click", (e) => {
  const b = e.target.closest(".bt-errada");
  if (!b) return;
  const k = b.dataset.id;
  if (erradas[k]) delete erradas[k]; else erradas[k] = true;
  salvar();
  render();
});
$("#b-erradas").onclick = () => {
  const linhas = itens.filter((p) => erradas[id(p)]).map((p) => [p.sku, p.imagem, p.vendedor, p.nome]);
  if (!linhas.length) { $("#dica").textContent = "Nenhuma foto marcada como errada."; return; }
  baixarCSV("imagens_rejeitadas", ["sku", "imagem", "vendedor", "nome"], linhas);
};
document.querySelectorAll(".filtros-np input, .filtros-np select").forEach((el) =>
  el.addEventListener("input", () => { limite = POR_PAGINA; render(); }));
$("#b-mais").addEventListener("click", () => { limite += POR_PAGINA; render(); });
render();
</script>
</body>
</html>
